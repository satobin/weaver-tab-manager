name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate and package previews
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version

      - name: Enable pinned pnpm
        run: corepack enable

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Check known high-severity advisories
        run: pnpm audit --audit-level high

      - name: Run source validation
        run: pnpm run check

      - name: Build test-branded unpacked extension
        run: pnpm run build:test

      - name: Build and validate Chrome preview package
        run: pnpm run package:preview:chrome

      - name: Build and validate Edge preview package
        run: pnpm run package:preview:edge

  # The Ubuntu job owns the full test, lint, format, and audit pass. This job
  # exercises only the build and packaging paths that can differ on Windows.
  windows-packaging:
    name: Validate Windows packaging
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version

      - name: Enable pinned pnpm
        run: corepack enable

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Build test-branded unpacked extension
        run: pnpm run build:test

      - name: Build and validate Chrome preview package
        run: pnpm run package:preview:chrome

      - name: Build and validate Edge preview package
        run: pnpm run package:preview:edge
